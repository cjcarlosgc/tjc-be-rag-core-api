changed:
  - "SYSTEM-2.4 / INTEROP-2.4 - Console con login solo GitHub LIBERADA para publicacion (T-003-console-github-login, HU62; commits b824b08, 96e96b7, 34fe1a6). El usuario la esta publicando; este evento se emite a su pedido y NO confirma por si solo que el despliegue haya terminado. Ya no ofrece correo ni contrasena, recuperacion de contrasena ni solicitud de acceso. Implementa - 401 GITHUB_IDENTITY_REQUIRED terminal (mensaje en /login, sin bucle ni redireccion automatica y con signOut local de Supabase); 401 AUTH_REQUIRED, INVALID_ACCESS_TOKEN o sin code cierran sesion; 401 GITHUB_ACCOUNT_REQUIRED y GITHUB_USER_TOKEN_INVALID NO cierran sesion y llevan a Renovar acceso a GitHub; 503 IDENTITY_UNAVAILABLE y GITHUB_VERIFICATION_UNAVAILABLE reintentables sin afirmar inexistencia; 404 GITHUB_REPOSITORY_NOT_FOUND como caso unico y 403 GITHUB_APP_ACCESS_REQUIRED como unico caso de instalar la App; mensajes para 400 REPOSITORY_OUTSIDE_WORKSPACE y 403 REPOSITORY_PERMISSION_INSUFFICIENT; verify-app-access con response.ok (200 o 201); repos con permiso read o triage no vinculables segun permissions; socket con auth.token en el handshake y connect_error con error.data {code,message,retryable} (connect() con backoff acotado si retryable:true; los no reintentables cierran sesion sin bucle) y reinicio del socket al cerrar sesion o cambiar de usuario. NO envia workspaceId a POST o GET /projects ni a GET /integrations/github/repositories y NO consume workspace ni role de ProjectResponse. Mirrors SYSTEM-2.4 e INTEROP-2.4 identicos a los de Core (sourceRevision de Core f1eed4d)."
requiredAction:
  - "1) Orden de despliegue - desplegar el bundle A de Core SOLO despues de que el usuario confirme que el despliegue de esta Console termino. Las migraciones user_github_identities y enable_rls_all_tables ya figuran aplicadas en Supabase (verificado por lectura el 2026-09-21). 2) Usuarios existentes - el unico usuario sin identidad GitHub es smoke-test@tjc.dev (cuenta de prueba sin proyectos; el usuario la borrara en Supabase); no hay proyectos, bindings ni filas huerfanas en la base compartida, asi que no hay migracion pendiente. 3) El proveedor de correo de Supabase se deshabilita solo despues de desplegar esta Console. 4) Console espera el CONTRACT_SYNC de implementacion del bundle B (workspaces, roles, SubscribeAck) antes de enviar workspaceId o consumir workspace y role. 5) No hay incompatibilidad que notificar a Core."
sourceRevision: 34fe1a6
status: ACKNOWLEDGED
