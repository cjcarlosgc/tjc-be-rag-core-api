changed:
  - INTEROP-2.3 implementado en Core (T-002-binding-lifecycle), sin cambios incompatibles ni de shape de respuesta. Live en Core: DELETE /projects/{projectId} -> 204 (borrado logico sin restauracion; 404 PROJECT_NOT_FOUND si es inexistente, ajeno o ya borrado; libera el binding y deja de exponer por API todo lo del Project) (HU56); POST /projects/{projectId}/integrations/github/enable -> 200 ProjectRepositoryBindingResponse (idempotente; revalida el acceso de la App y refresca installationId; reactiva DISABLED y tambien REVOKED si la App recupero acceso; sin acceso 403 GITHUB_APP_ACCESS_REQUIRED y el estado no cambia) (HU57); POST /projects/{projectId}/integrations/github valida en este orden 404 PROJECT_NOT_FOUND, 409 REPOSITORY_BINDING_ALREADY_EXISTS, 403 GITHUB_APP_ACCESS_REQUIRED, 404 GITHUB_REPOSITORY_NOT_FOUND (el repositoryId real de GitHub no coincide con el enviado para repositoryName), 409 REPOSITORY_ALREADY_BOUND (mensaje generico que no revela Project ni usuario ajeno), 404 INTEGRATION_BRANCH_NOT_FOUND; una violacion de unicidad concurrente es 409, nunca 500. GET, DELETE y POST enable de .../integrations/github responden 404 PROJECT_NOT_FOUND si el Project es inexistente, ajeno o borrado, y 404 REPOSITORY_BINDING_NOT_FOUND solo si el Project vive y no tiene binding. Desconectar (DELETE .../integrations/github) deja DISABLED (pausa reversible) y sobre REVOKED responde 204 sin cambiarlo. verify-app-access devuelve repositoryId y repositoryName tal como se enviaron (la validacion autoritativa es el POST del binding). installation.suspend solo pausa bindings ENABLED y installation.unsuspend no reactiva uno pausado por el usuario. Supera a CS-20260920-002 (contrato definido, implementacion pendiente); el texto de INTEROP-2.3 cambio despues de caa4336 (orden de validacion con GITHUB_REPOSITORY_NOT_FOUND y aclaraciones de verify-app-access y suspend); SYSTEM-2.3 no cambio.
requiredAction:
  - Recopilar byte por byte los mirrors desde Core: INTEROP-2.3 (cambio de texto posterior a caa4336, en las secciones 1, 6.1 y 6.8) y SYSTEM-2.3 (sin cambios; verificar que la copia coincide). Pasar a live los adapters enableRepository (POST /projects/{projectId}/integrations/github/enable) y deleteProject (DELETE /projects/{projectId}), reemplazando el PendingContractError de ambos. Manejar 409 REPOSITORY_ALREADY_BOUND (mensaje generico sin datos del otro Project), 404 GITHUB_REPOSITORY_NOT_FOUND al vincular, y 404 PROJECT_NOT_FOUND en get, enable, disable y binding cuando el Project esta borrado o es ajeno; 404 REPOSITORY_BINDING_NOT_FOUND significa solo Project vivo sin binding. Tras deleteProject exitoso (204) tratar el Project como inexistente; no existe restauracion. Reactivar con enable tambien desde REVOKED; ante 403 GITHUB_APP_ACCESS_REQUIRED el estado sigue igual y se ofrece la configureUrl de la App. Acusar recibo (ACKNOWLEDGED) y notificar a Core cualquier incompatibilidad.
