type: CONTRACT_SYNC
id: CS-20260921-002
source: core
targets: [console]
breaking: false
changed:
  - SYSTEM-2.4 / INTEROP-2.4 - IMPLEMENTACION del BUNDLE A en Core (corte 1 HU62 identidad GitHub + corte 4a HU64 correccion de seguridad del binding). Sin cambios de contrato respecto de CS-20260921-001; este evento declara lo que Core responde cuando este bundle este desplegado. breaking:false CUALIFICADO: el cable no cambia de forma (sin rutas, DTOs ni campos nuevos; los errores nuevos usan el envelope existente), pero cambia el comportamiento observable. (1) Identidad: toda sesion exige identidad GitHub. Core resuelve el githubUserId con la Admin API de Supabase (identities[] del provider github, nunca user_metadata), lo persiste y no vuelve a consultar Supabase para ese usuario. Sin identidad GitHub: 401 GITHUB_IDENTITY_REQUIRED en toda ruta autenticada. Admin API caida y vinculo aun no persistido: 503 IDENTITY_UNAVAILABLE (reintentable). El githubUserId ya vinculado a otro sub tambien responde 401 GITHUB_IDENTITY_REQUIRED de forma permanente hasta que un operador borre la fila huerfana; Console NO debe reintentar el login GitHub en bucle ante ese 401 (INTEROP 6.13 Identidad). El login con correo y contrasena deja de ser valido para Core. (2) POST /projects/{projectId}/integrations/github valida en este orden: 404 PROJECT_NOT_FOUND, 409 REPOSITORY_BINDING_ALREADY_EXISTS, 403 GITHUB_APP_ACCESS_REQUIRED, 404 GITHUB_REPOSITORY_NOT_FOUND, 400 REPOSITORY_OUTSIDE_WORKSPACE (en un Project personal el propietario del repositorio debe ser la cuenta del usuario), 403 REPOSITORY_PERMISSION_INSUFFICIENT, 409 REPOSITORY_ALREADY_BOUND, 404 INTEGRATION_BRANCH_NOT_FOUND. Un repositoryId falso, un repositorio sobre el que el usuario no tiene ningun permiso y un repositorio inexistente en una instalacion existente responden EXACTAMENTE el mismo 404 GITHUB_REPOSITORY_NOT_FOUND (mismo codigo, HTTP y mensaje): la Console no puede distinguirlos ni debe intentarlo. La unica diferencia residual aceptada por escrito (INTEROP 6.8) es 403 GITHUB_APP_ACCESS_REQUIRED cuando la App no esta instalada en el repositorio. Se rechazan repositorios ajenos y los de permiso read/triage; solo se aceptan maintain, write y admin. (3) POST /integrations/github/repositories/verify-app-access responde 200 (como dice INTEROP 6.8; antes respondia el 201 por defecto) y GET /integrations/github/repositories/{owner}/{repo}/branches exigen permiso maintain/write/admin del usuario: permiso menor 403 REPOSITORY_PERMISSION_INSUFFICIENT; sin visibilidad, branches responde 404 GITHUB_REPOSITORY_NOT_FOUND y verify-app-access responde 200 con status NOT_AUTHORIZED e installationId null (App no instalada: branches 403 GITHUB_APP_ACCESS_REQUIRED, verify-app-access 200 NOT_AUTHORIZED); permiso o propietario no verificable: 503 GITHUB_VERIFICATION_UNAVAILABLE, nunca NOT_AUTHORIZED ni 404. Un fallo de GitHub al resolver la instalacion tambien responde 503 en lugar de 500. Un Reader no debe llamar verify-app-access (403); para el estado del binding usa GET .../integrations/github. (4) POST .../integrations/github/enable sobre un binding REVOKED revalida ademas repositoryId (404 GITHUB_REPOSITORY_NOT_FOUND) y propietario (400 REPOSITORY_OUTSIDE_WORKSPACE); en ambos casos sigue REVOKED. (5) GET /integrations/github/repositories acepta workspaceId SOLO con el workspace personal, cuyo id es el githubUserId de la sesion (con el se listan solo repositorios propios); cualquier otro workspaceId responde 404 WORKSPACE_NOT_FOUND hasta el bundle B. Sin workspaceId la lista no se filtra. (6) WebSocket: el handshake sin token se acepta y el guard exige credencial en cada mensaje (AUTH_REQUIRED); con token presente que no autentica, Core rechaza la conexion con connect_error y error.data {code,message,retryable} (INVALID_ACCESS_TOKEN retryable:false, GITHUB_IDENTITY_REQUIRED retryable:false, IDENTITY_UNAVAILABLE retryable:true). Un rechazo de middleware desactiva la reconexion automatica de socket.io-client: con retryable:true, llamar a socket.connect(). NO incluido en el bundle A y NO disponible todavia (llega en el bundle B y su propio sync): GET /workspaces, PATCH /projects/{projectId}, workspaceId en POST /projects y GET /projects, workspace y role en ProjectResponse, WORKSPACE_ADMIN_REQUIRED, PROJECT_ROLE_INSUFFICIENT, la matriz rol->operacion, el registro de acceso, los webhooks de organizacion y SubscribeAck (subscribe:project-version sigue sin acknowledgment). Se mantiene el contrato de Project personal actual (solo el creador lo ve).
requiredAction:
  - 1) Orden de despliegue obligatorio: publicar PRIMERO la Console con login solo GitHub (sin login por correo y contrasena y sin depender de esas credenciales); DESPUES desplegar este bundle A de Core. Motivo: GITHUB_IDENTITY_REQUIRED aplica a TODA la sesion desde que el bundle A esta activo, asi que una Console que aun ofrezca correo dejaria a esos usuarios con 401 permanente. El proveedor de correo y contrasena de Supabase se deshabilita solo despues de que la Console ya no lo ofrezca, nunca antes; el manual linking de identidades de Supabase debe seguir deshabilitado. Antes de desplegar Core se aplican las migraciones user_github_identities y enable_rls_all_tables (RLS en todas las tablas; despues se desactiva la Data API de Supabase en el panel) y se valida contra GitHub real (GET /user/{id}, permiso de colaborador, App instalada en cuenta ajena). La GitHub App no debe ser instalada por terceros (idealmente privada) hasta que este bundle este desplegado. Este evento no autoriza a Console a enviar workspaceId a POST /projects ni GET /projects, ni a consumir workspace/role de ProjectResponse: eso solo tras el sync de implementacion del bundle B (los servidores rechazan campos de request no declarados con 400). 2) Adaptar los adapters de Console (control-plane/api.ts y api/client.ts; la Console no se edita desde Core): (a) tratar 401 GITHUB_IDENTITY_REQUIRED como sesion sin identidad GitHub, dirigiendo al login GitHub una sola vez y sin bucle si vuelve a fallar con el mismo codigo, y sin confundirlo con token expirado (hoy client.ts:44 dispara unauthorizedHandler ante cualquier 401); (b) tratar 503 IDENTITY_UNAVAILABLE y 503 GITHUB_VERIFICATION_UNAVAILABLE como reintentables sin afirmar que el repositorio no existe ni que el permiso falta; (c) tratar 404 GITHUB_REPOSITORY_NOT_FOUND al vincular como un unico caso (repositorio no encontrado o sin permiso) sin distinguir los motivos, y mantener 403 GITHUB_APP_ACCESS_REQUIRED como el unico caso instalar la GitHub App; (d) mostrar 400 REPOSITORY_OUTSIDE_WORKSPACE y 403 REPOSITORY_PERMISSION_INSUFFICIENT con mensaje claro (se requiere maintain/write/admin sobre un repositorio propio); (e) aceptar verify-app-access con 200 (usa response.ok; sin cambio funcional) y no llamarlo para usuarios Reader; (f) enviar workspaceId a GET /integrations/github/repositories solo con el id del workspace personal (el githubUserId de la sesion), o no enviarlo; (g) el cliente WebSocket puede seguir sin auth; si envia auth.token, debe manejar connect_error con error.data {code,message,retryable} y, con retryable:true, llamar a socket.connect() porque no reconecta solo; (h) mostrar en la lista de repositorios los de permiso read/triage como no vinculables usando permissions, pero el rechazo autoritativo es del POST. Actualizar mocks (mockBackend) para reflejar los nuevos codigos y el orden de validacion. 3) Recopilar byte por byte los mirrors SYSTEM-2.4 e INTEROP-2.4 desde Core (sin cambios respecto de CS-20260921-001 salvo las aclaraciones de INTEROP 6.6 sobre el handshake sin token y de 6.13 Identidad sobre un githubUserId ya vinculado a otro sub). Los tests contra Core real deben esperar 200 en verify-app-access. 4) Acusar recibo (ACKNOWLEDGED) y notificar a Core cualquier incompatibilidad. Este evento no autoriza cambios funcionales en Core ni en otros repositorios. El sync de implementacion del bundle B llega por separado; no depender de SubscribeAck ni de los campos workspace/role hasta entonces.
