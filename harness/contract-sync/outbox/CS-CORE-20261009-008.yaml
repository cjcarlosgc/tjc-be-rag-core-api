changed:
  - INTEROP-2.7 §6.5.1 implementado (WI-CORE-023/024/025), sin cambio de version. ExperimentStatusResponse agrega model, budget, executionProfile, runnerHint, randomizationSeed; ExperimentRepetitionResponse agrega pairId, pairPosition (1|2), attempt (1|2) y technicallyEvaluable (en corridas previas los cinco primeros y pairId/pairPosition vienen null; attempt=1 y technicallyEvaluable=true). Cambio observable: ExperimentRepetitionResponse.executionDurationMs es number|null (null si el Sandbox no ejecuto y en corridas previas; antes se emitia 0). Cambio de semantica: tasas y promedios de StrategyMetricsResponse (validRate, compilationRate, executionRate, passedRate, duraciones, tokens, costo, chunks, herramientas, archivos y failures) se calculan solo sobre repeticiones con technicallyEvaluable=true (cambia el denominador); sin slots evaluables las tasas valen 0 y los promedios 0 (duraciones) o null, y ese 0 significa sin datos evaluables y no 0% valido; StrategyMetricsResponse.executionDurationMs sigue siendo number. POST /experiments: nuevos 422 REASONING_EFFORT_UNSUPPORTED (details.supportedEfforts: string[]) y 422 UNSUPPORTED_PROJECT (PHP o sin framework JEST/VITEST) y 503 LLM_PROVIDER_UNAVAILABLE si el modelo no esta disponible; en todos no se crea el experimento. Reintento: solo fallos externos (LLM 5xx/429/conexion, excepcion del cliente de Sandbox, INFRASTRUCTURE salvo TIMED_OUT), un unico intento 2 inmediato; tras el segundo fallo externo, o si el intento 2 queda huerfano, technicallyEvaluable=false; TIMED_OUT no se reintenta; los experimentos creados antes de OE5 no tienen pareado ni reintento. La identidad Core->Sandbox del intento 2 (sufijo :2) es interna de Core e informativa. Ningun DTO declara ganador y no se expone ningun campo interno.
requiredAction:
