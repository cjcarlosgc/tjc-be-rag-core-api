changed:
  - SYSTEM-2.4 / INTEROP-2.4 (contrato definido, implementacion pendiente; HU58-HU64, DEC-ORG-001 y DEC-ORG-002 aprobadas por el usuario). breaking:false CUALIFICADO: el cable es aditivo, pero cambia el comportamiento observable. Aditivo en cable: GET /workspaces; PATCH /projects/{projectId}; workspaceId opcional en POST /projects, GET /projects y GET /integrations/github/repositories; workspace y role en ProjectResponse; 8 codigos de error nuevos (GITHUB_IDENTITY_REQUIRED 401, IDENTITY_UNAVAILABLE 503, WORKSPACE_NOT_FOUND 404, WORKSPACE_ADMIN_REQUIRED 403, PROJECT_ROLE_INSUFFICIENT 403 con details{requiredRole,currentRole}, REPOSITORY_OUTSIDE_WORKSPACE 400, REPOSITORY_PERMISSION_INSUFFICIENT 403, GITHUB_VERIFICATION_UNAVAILABLE 503); matriz rol->operacion (Reader/Maintainer/Admin, INTEROP 6.13); SubscribeAck en el acknowledgment de subscribe:project-version ({subscribed,code,retryable}; la Console emite subscribe sin callback y lo ignora); connect_error.data ({code,retryable}) al rechazar el handshake WebSocket. Cambios de comportamiento: (1) login solo con GitHub; Core exige identidad GitHub en toda sesion (401 GITHUB_IDENTITY_REQUIRED) y se retira el login con correo y contrasena; (2) POST .../integrations/github, verify-app-access y branches rechazan lo antes aceptado (repositorio ajeno, permiso menor a maintain); (3) un Reader no debe llamar verify-app-access (403; usa GET .../integrations/github); (4) un binding REVOKED deja de ser visible para Maintainer y Reader (404; solo Admin); (5) GET /action-required?projectId=X de un Project no visible responde 404 PROJECT_NOT_FOUND (antes, pagina vacia); (6) los Projects personales no se comparten; DELETE /projects/{projectId} y la creacion en organizacion solo para Admin; (7) en una organizacion se exige siempre membresia activa ademas del permiso sobre el repositorio.
requiredAction:
  - 1) Orden de despliegue: publicar PRIMERO la Console con login solo GitHub; el bundle A de Core (identidad GitHub + correccion de seguridad del binding) espera a esa publicacion porque GITHUB_IDENTITY_REQUIRED aplica a toda la sesion; el proveedor de correo de Supabase se deshabilita solo despues de que la Console ya no lo ofrezca. Despues el bundle A de Core; la GitHub App no debe ser instalada por terceros (idealmente privada) hasta desplegarlo; el bundle A solo acepta workspaceId (el personal) en GET /integrations/github/repositories. Por ultimo el bundle B de Core (workspaces, roles, acceso y webhooks, siempre juntos). 2) NO enviar workspaceId a POST /projects ni a GET /projects, ni consumir workspace/role de ProjectResponse, hasta recibir el CONTRACT_SYNC de implementacion del bundle B: los servidores rechazan campos de request no declarados (400). 3) Recopilar byte por byte los mirrors SYSTEM-2.4 e INTEROP-2.4 desde Core. Preparar la Console para: login solo GitHub; 401 GITHUB_IDENTITY_REQUIRED y 503 IDENTITY_UNAVAILABLE (reintentable); 403 PROJECT_ROLE_INSUFFICIENT; 404 sin visibilidad; 503 GITHUB_VERIFICATION_UNAVAILABLE (reintentar, no mostrar que no existe); un Project con binding REVOKED oculto para no Admin; y tratar 404 PROJECT_NOT_FOUND en GET /action-required?projectId. 4) Acusar recibo (ACKNOWLEDGED) y notificar a Core cualquier incompatibilidad. Este evento no autoriza cambios funcionales; los syncs de implementacion de los bundles A y B llegan por separado.
