changed:
  - Se documenta en INTEROP que ExperimentStatusResponse.failureCode (string | null, abierto, sin cambio de tipo) toma hoy los valores EXPERIMENT_FAILED (error capturado durante la ejecucion) y EXPERIMENT_WORKER_LOST (worker caido y cola con intentos agotados). Un run FAILED puede reanudarse y, al completar, failureCode y failureMessage vuelven a null.
requiredAction:
  - Console debe tolerar cualquier valor desconocido de failureCode y mostrar un mensaje claro para los dos conocidos (EXPERIMENT_FAILED: el experimento fallo durante la ejecucion; EXPERIMENT_WORKER_LOST: se interrumpio el procesamiento y puede reanudarse), usando failureMessage como detalle. Sin cambio de tipos ni de rutas.
