changed:
  - SYSTEM-2.4 / INTEROP-2.4 - IMPLEMENTACION del BUNDLE B en Core (cortes 2, 3 y 5 de 014-organizations-access; HU58, HU59, HU60, HU61, HU63, HU64 y HU55, esta ultima aprobada por el usuario dentro de T-003). Sin cambios de contrato respecto de CS-20260921-001 y CS-20260921-002 salvo que los marcadores 'pendiente de implementacion' de INTEROP-2.4 (secciones 1, 6.9, 6.10 y 6.13) pasan a implementado; este evento declara lo que Core responde cuando el bundle B este desplegado. breaking:false CUALIFICADO: el cable es aditivo (los servidores rechazan campos de request no declarados con 400 mientras el bundle B no este desplegado), pero cambia el comportamiento observable. Ya en Core al desplegar el bundle B - (1) GET /workspaces -> 200 {items: WorkspaceResponse[]} sin paginar: la cuenta personal primero ({kind:'PERSONAL', id: githubUserId de la sesion, login (null solo si Core aun no lo conoce), avatarUrl, role:'ADMIN'}) y cada organizacion con la App instalada donde el usuario es miembro activo ({kind:'ORGANIZATION', id: id numerico de GitHub, login, avatarUrl, role: 'ADMIN' si es owner, si no 'MEMBER'}), ordenadas por login. WorkspaceRefResponse.id es el workspaceId de las demas rutas. Si GitHub no responde, la lista se compone de la cuenta personal y de las organizaciones donde el usuario ya tiene acceso registrado (role ADMIN si tiene algun registro Admin, si no MEMBER); no se ofrecen organizaciones nuevas y una organizacion sin Members:read aceptado no se ofrece. (2) POST /projects acepta workspaceId opcional (omitido o igual al id del workspace personal = personal). Con el id de una organizacion crea solo un owner activo: workspaceId que no es un workspace del usuario 404 WORKSPACE_NOT_FOUND; miembro que no es owner 403 WORKSPACE_ADMIN_REQUIRED; GitHub sin respuesta 503 GITHUB_VERIFICATION_UNAVAILABLE. El workspace de un Project se fija al crearlo y no cambia. (3) GET /projects?workspaceId&cursor&limit devuelve los Projects visibles (personales del creador y de organizaciones con acceso verificado) y, sin workspaceId, todos. Con workspaceId de un workspace ajeno 404 WORKSPACE_NOT_FOUND, y si la pertenencia no es verificable y no hay acceso registrado a esa organizacion, 503 GITHUB_VERIFICATION_UNAVAILABLE (nunca 404). En listados los Projects que no se pueden verificar se omiten sin fallar. (4) ProjectResponse lleva workspace ({kind,id,login}) y role (ADMIN|MAINTAINER|READER, rol del usuario en ese Project) en POST/GET/GET-lista/PATCH. (5) PATCH /projects/{projectId} con {name} (trim, 1..200; cualquier otro campo 400) solo para Admin y responde 200 ProjectResponse. (6) Matriz rol->operacion (INTEROP 6.13) aplicada a todas las rutas con default-deny. Project no visible -> el 404 propio del recurso (PROJECT_NOT_FOUND, ANALYSIS_RUN_NOT_FOUND, PROJECT_VERSION_NOT_FOUND, EXPERIMENT_NOT_FOUND, TEST_PUBLICATION_NOT_FOUND, FUNCTIONAL_QUESTION_NOT_FOUND, UNRESOLVABLE_TARGET), identico al de un id inexistente; visible con rol menor -> 403 PROJECT_ROLE_INSUFFICIENT con details {requiredRole,currentRole}; acceso nuevo no verificable por caida de GitHub -> 503 GITHUB_VERIFICATION_UNAVAILABLE (no mostrar 'no existe'; reintentar). Reader: todas las lecturas; Maintainer: POST/enable/DELETE del binding, responder preguntas (answers), publicar tests (test-publications) y POST /experiments; Admin: PATCH y DELETE de /projects y crear Projects en una organizacion. (7) Visibilidad: un Project personal solo lo ve su creador (siempre Admin) y otra persona recibe el 404 del recurso; en una organizacion se exige siempre ser miembro activo (un colaborador externo con write no accede y el read implicito de un repositorio publico no cuenta); un Project sin repositorio o con binding REVOKED solo lo ve un Admin (owner de la organizacion) y un no Admin recibe 404; si la organizacion desaparece o se desinstala la App, el Project se oculta a todos y se conserva (reaparece al reinstalar la App o volver la organizacion, con el binding REVOKED hasta que un Admin lo reactive con POST .../enable). El acceso a un Project de organizacion se crea al entrar (Core verifica en vivo; tambien por deep link a un Run, version, pregunta, publicacion o experimento), sin invitaciones. (8) GET /analysis-runs?status&cursor&limit (HU55) responde 200 Page<AnalysisRunSummaryResponse> con los Runs de todos los Projects visibles (personales del usuario y de organizacion con acceso ya registrado; no verifica contra GitHub ni da de alta); GET /action-required sin projectId cubre lo mismo; GET /action-required?projectId=X de un Project no visible responde 404 PROJECT_NOT_FOUND. (9) WebSocket: el acknowledgment de subscribe:project-version devuelve SubscribeAck con exactamente tres resultados: {subscribed:true, code:null, retryable:false}; {subscribed:false, code:'GITHUB_VERIFICATION_UNAVAILABLE', retryable:true} (reintentar); {subscribed:false, code:null, retryable:false} (sin visibilidad, indistinguible de un id inexistente). Se exige al menos rol Reader al suscribirse y Core saca al socket de las salas de un Project cuando el usuario pierde el acceso, el binding pasa a REVOKED (y no es Admin) o el Project se borra; la Console emite subscribe sin callback y por tanto lo ignora, y el polling sigue siendo el fallback. (10) POST /experiments exige ademas que el target pertenezca al projectId del body (si no, el mismo 404 UNRESOLVABLE_TARGET que un target inexistente). (11) Sin cambios de forma en los webhooks de GitHub (202 y GitHubWebhookAcceptedResponse; sin efecto para la Console): Core procesa member, membership, organization, team y repository; ante caida de GitHub conserva los accesos existentes y niega los nuevos, y una reconciliacion horaria corrige lo que un evento perdido deje desfasado (ventana de hasta una hora para cambios de rol o de permiso base de la organizacion sin evento). Cambios de comportamiento ya declarados en CS-20260921-001 y CS-20260921-002 (login solo GitHub, rechazo de repositorios ajenos y de permiso menor a maintain, REVOKED oculto a Maintainer y Reader, GET /action-required?projectId no visible 404, Projects personales no compartidos, verify-app-access y branches con permiso maintain/write/admin, enable/branches/verify-app-access del bundle A) siguen vigentes sin cambios.
requiredAction:
  - 1) Orden de despliegue (sin cambios): Console con login solo GitHub PRIMERO; despues el bundle A de Core; por ultimo el bundle B de Core (workspaces, roles, acceso y webhooks, siempre juntos). Hasta que el bundle B este desplegado en el entorno contra el que corre la Console, los servidores rechazan workspaceId en POST /projects y GET /projects con 400 (bundle A solo acepta workspaceId en GET /integrations/github/repositories) y GET /workspaces, PATCH /projects/{id} y GET /analysis-runs no existen: gatear estas llamadas (feature flag o version de Core) hasta entonces. 2) Desde este sync, y una vez Core bundle B desplegado, la Console YA PUEDE consumir: GET /workspaces (selector de workspace: personal primero, luego organizaciones; enviar WorkspaceRefResponse.id como workspaceId); workspaceId en POST /projects, GET /projects y GET /integrations/github/repositories (enviar Project.workspace.id al vincular); workspace y role de ProjectResponse (ocultar o deshabilitar acciones segun role: PATCH y DELETE de Project solo Admin; vincular, pausar, reactivar el binding, responder preguntas, publicar tests y crear experimentos desde Maintainer; lecturas desde Reader); PATCH /projects/{projectId} {name} para renombrar (Admin); GET /analysis-runs sin projectId (HU55: reemplazar el PendingContractError de control-plane/api.ts, listado global de Analysis Runs) y GET /action-required sin projectId; SubscribeAck opcional del subscribe:project-version. 3) Manejo de errores: 403 PROJECT_ROLE_INSUFFICIENT (leer details.requiredRole y details.currentRole; mensaje claro, no reintentar); 403 WORKSPACE_ADMIN_REQUIRED (solo un owner crea Projects en la organizacion); 404 WORKSPACE_NOT_FOUND (workspace no valido para el usuario; refrescar GET /workspaces); 404 del recurso (no visible o inexistente, sin distinguir; incluye un Project sin repositorio o con binding REVOKED para un no Admin y GET /action-required?projectId no visible); 503 GITHUB_VERIFICATION_UNAVAILABLE en GET /projects?workspaceId, GET/POST/PATCH sobre Projects de organizacion, discovery con workspaceId y suscripciones (reintentar; no mostrar que el Project o el workspace no existe); 401 GITHUB_IDENTITY_REQUIRED y 503 IDENTITY_UNAVAILABLE como en CS-20260921-002. Los listados omiten en silencio lo no verificable: no interpretar un listado vacio como definitivo si la Console sabe que GitHub esta degradado. 4) WebSocket: sin cambios para el cliente actual; con SubscribeAck {subscribed:false, code:null} dejar de esperar eventos de esa version y refrescar por HTTP; con retryable:true reintentar el subscribe; si el servidor saca al socket de la sala (perdida de acceso) el polling HTTP cubre el estado y el HTTP responde 404. 5) Recopilar de nuevo byte por byte los mirrors SYSTEM-2.4 e INTEROP-2.4 desde Core (INTEROP-2.4 cambia solo en los marcadores de estado de implementacion de las secciones 1, 6.9, 6.10 y 6.13 y en la aclaracion de 6.9 sobre la lista de owners vacia; SYSTEM-2.4 cambia en las decisiones derivadas (aa)-(ac) de DEC-ORG-002: verificar que la copia coincide). Actualizar mocks (mockBackend) con workspaces, role, PATCH, GET /analysis-runs y los errores nuevos. 6) Este evento no autoriza cambios funcionales en Core ni en otros repositorios. Pendientes de validacion contra una organizacion real (Core, no bloquean a Console): lecturas de membresia y permisos con la GitHub App, lista de owners con Members:read, eventos de webhook reales y expulsion real de sockets. Acusar recibo (ACKNOWLEDGED) y notificar a Core cualquier incompatibilidad.
